name: Release

# Publishes a release whenever main has a manifest version with no release yet.
# To ship a new version: bump "version" in static/manifest.json and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version and check for an existing release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./static/manifest.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.ver.outputs.skip != 'true'
        run: npm ci
      - if: steps.ver.outputs.skip != 'true'
        run: node build.mjs
      - name: Package extension
        if: steps.ver.outputs.skip != 'true'
        run: cd dist && zip -qr ../sheetdown.xpi .
      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          Firefox extension that makes Pokemon Showdown look like a spreadsheet, with a built-in damage calculator.

          **Install:** download `sheetdown.xpi` below, then in Firefox open `about:debugging` → This Firefox → Load Temporary Add-on and pick the file.

          **Shortcuts:** Alt+Shift+S toggles spreadsheet mode. Alt+Shift+Q switches to a decoy sheet.
          NOTES
          gh release create "$TAG" sheetdown.xpi --target "$GITHUB_SHA" --title "Sheetdown $TAG" --notes-file notes.md
